name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (testes unitários)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-end
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: back-end/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests/unit -v

  infra:
    name: Infra (compose e Dockerfiles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests/infra -v

  mobile:
    name: Mobile (analyze e testes Flutter)
    runs-on: ubuntu-latest
    # Mesma versão exigida pelo pubspec.lock (Flutter >= 3.44).
    container: ghcr.io/cirruslabs/flutter:3.44.0
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - run: flutter --version
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test

  containers:
    name: Imagens, vulnerabilidades e smoke test
    runs-on: ubuntu-latest
    needs: [backend, infra]
    timeout-minutes: 30
    env:
      TRIVY_IMAGE: aquasec/trivy:0.67.2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Preparar configuração e segredos efêmeros
        run: |
          cp .env.example .env
          ./scripts/init-secrets.sh

      - name: Construir imagens
        run: docker compose build

      - name: Varredura de vulnerabilidades (HIGH/CRITICAL com correção)
        run: |
          for image in reclame-ja/backend:local reclame-ja/web:local; do
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              "$TRIVY_IMAGE" image --quiet --scanners vuln \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
              "$image"
          done

      - name: Subir stack completo
        run: docker compose up -d --wait --wait-timeout 600

      - name: Smoke test ponta a ponta
        run: python -m unittest discover -s tests/smoke -v

      - name: Logs dos containers
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Derrubar stack
        if: always()
        run: docker compose down -v
