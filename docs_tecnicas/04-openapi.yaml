openapi: 3.0.3
info:
  title: API do App de Reportes Cidadãos
  version: 1.0.0
  description: >
    Contrato v1 entre o app Flutter e o backend FastAPI. Fonte da verdade para clientes e testes (RT-19).
    Itens marcados [EXTENSÃO] não constam na tabela de endpoints do documento de Regras Técnicas.
    Datas/horas (`format: date-time`) devolvidas pela API estão sempre em UTC e com o fuso explícito
    (ex.: `2026-11-19T23:29:25.789511Z`); o cliente converte para o horário local ao exibir.
servers:
  - url: http://localhost:8000
    description: Desenvolvimento local (emulador Android usa http://10.0.2.2:8000)
  - url: https://api.staging.exemplo.org
    description: Homologação
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: reports
  - name: me
  - name: public
  - name: agency
  - name: uploads

paths:
  /health:
    get:
      tags: [public]
      security: []
      summary: Verificação de saúde
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  /v1/auth/login:
    post:
      tags: [auth]
      security: []
      summary: Login por e-mail (OTP) ou Google
      description: >
        Passo 1 (e-mail): enviar só `email` -> 202 e o código chega por e-mail.
        Passo 2: enviar `email` + `code` -> 200 com tokens.
        Google: enviar `google_id_token` -> 200 com tokens.
        No primeiro acesso é obrigatório enviar `consent`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Autenticado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthTokens" }
        "202":
          description: Código enviado por e-mail
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: otp_sent }
                  expires_in: { type: integer, example: 600 }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /v1/auth/refresh:
    post:
      tags: [auth]
      security: []
      summary: Renova o token de acesso (refresh rotativo) [EXTENSÃO]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: Novos tokens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthTokens" }
        "401": { $ref: "#/components/responses/Error" }

  /v1/reports:
    post:
      tags: [reports]
      summary: Cria reporte (idempotente pelo ID do cliente)
      description: >
        Se o `id` já existir para o mesmo usuário, devolve 200 com o reporte existente (RT-03).
        Se `has_photo` for verdadeiro, a resposta traz `upload` com URL assinada para enviar a foto.
        O `address` opcional é o endereço textual obtido no aparelho (geocodificação reversa do
        ponto GPS); o reenvio idempotente não altera o endereço já gravado.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateReportRequest" }
      responses:
        "200":
          description: Reporte já existia (reenvio idempotente)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportCreated" }
        "201":
          description: Reporte criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportCreated" }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /v1/reports/nearby:
    get:
      tags: [reports]
      security: [{}, { bearerAuth: [] }]
      summary: Ocorrências por raio, categoria e status
      description: >
        Rota pública. Devolve uma ocorrência por grupo de duplicados (a mais próxima),
        ordenadas por distância. Reportes em moderação não aparecem. Coordenadas são
        publicadas com 4 casas decimais (~11 m); raio e `distance_m` usam essa
        coordenada publicada, nunca a posição exata. Sem protocolo, descrição,
        endereço textual ou foto. Cursor inválido devolve 422.
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lon, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: radius_m, in: query, schema: { type: integer, minimum: 50, maximum: 5000, default: 1000 } }
        - { name: category, in: query, schema: { $ref: "#/components/schemas/Category" } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/Status" } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: Lista de ocorrências próximas (agrupadas)
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/NearbyItem" }
                  next_cursor: { type: string, nullable: true }
        "422": { $ref: "#/components/responses/Error" }

  /v1/reports/{id}:
    get:
      tags: [reports]
      summary: Detalhe, status, classificação e linha do tempo
      parameters:
        - $ref: "#/components/parameters/ReportId"
      responses:
        "200":
          description: Reporte
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportDetail" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/reports/{id}/photo/complete:
    post:
      tags: [reports]
      summary: Conclui o upload e agenda a higienização da foto
      parameters:
        - $ref: "#/components/parameters/ReportId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sha256]
              properties:
                sha256: { type: string, description: "Hash SHA-256 (hex) do arquivo enviado" }
      responses:
        "202":
          description: Foto aceita; processamento assíncrono
          content:
            application/json:
              schema:
                type: object
                properties:
                  photo_status: { type: string, enum: [processing] }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/uploads/{token}:
    put:
      tags: [uploads]
      security: []
      summary: Envia a foto usando a URL assinada
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "204": { description: Upload recebido }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/photos/{token}:
    get:
      tags: [uploads]
      security: []
      summary: Lê uma foto usando uma URL assinada temporária
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Foto JPEG recodificada
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }

  /v1/reports/{id}/triage:
    post:
      tags: [reports]
      summary: Cidadão confirma ou corrige categoria e órgão sugeridos (RN-10) [EXTENSÃO]
      parameters:
        - $ref: "#/components/parameters/ReportId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TriageRequest" }
      responses:
        "200":
          description: Triagem registrada; encaminhamento iniciado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportDetail" }
        "404": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/reports/{id}/comments:
    get:
      tags: [reports]
      security: []
      summary: Lista comentários públicos do reporte
      parameters:
        - $ref: "#/components/parameters/ReportId"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Comentários mais recentes primeiro
          content:
            application/json:
              schema:
                type: object
                required: [items, count]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, report_id, content, created_at]
                      properties:
                        id: { type: integer }
                        report_id: { type: string, format: uuid }
                        content: { type: string }
                        created_at: { type: string, format: date-time }
                  count: { type: integer }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [reports]
      summary: Adiciona comentário público (sem edição/remoção no MVP)
      parameters:
        - $ref: "#/components/parameters/ReportId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  minLength: 1
                  maxLength: 1000
      responses:
        "201":
          description: Comentário publicado
          content:
            application/json:
              schema:
                type: object
                required: [id, report_id, content, created_at]
                properties:
                  id: { type: integer }
                  report_id: { type: string, format: uuid }
                  content: { type: string }
                  created_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/reports/{id}/confirm:
    post:
      tags: [reports]
      summary: Confirmação “Vi isso” (+1), uma por usuário/grupo, exceto o autor
      parameters:
        - $ref: "#/components/parameters/ReportId"
      responses:
        "200":
          description: Confirmação registrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  confirmation_count: { type: integer }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/reports/{id}/reopen:
    post:
      tags: [reports]
      summary: Reabertura, quando permitida (RN-13)
      parameters:
        - $ref: "#/components/parameters/ReportId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Reaberto
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportDetail" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }

  /v1/reports/{id}/flag:
    post:
      tags: [reports]
      summary: Sinaliza abuso para moderação (RN-35)
      parameters:
        - $ref: "#/components/parameters/ReportId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, enum: [ofensivo, dados_pessoais, falso, duplicado_abusivo, outro] }
                note: { type: string, maxLength: 500 }
      responses:
        "202":
          description: Sinalização recebida
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/reports/{id}/nudge:
    post:
      tags: [reports]
      summary: Cobrar novamente um reporte atrasado (RN-14) [EXTENSÃO]
      parameters:
        - $ref: "#/components/parameters/ReportId"
      responses:
        "202":
          description: Cobrança registrada e órgão notificado
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /v1/me:
    get:
      tags: [me]
      summary: Dados da conta [EXTENSÃO]
      responses:
        "200":
          description: Usuário
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
    patch:
      tags: [me]
      summary: Corrige dados da conta [EXTENSÃO]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: Conta atualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [me]
      summary: Exclui a conta e os dados pessoais (RN-41, RT-51) [EXTENSÃO]
      responses:
        "202":
          description: Exclusão iniciada
        "401": { $ref: "#/components/responses/Error" }

  /v1/me/export:
    get:
      tags: [me]
      summary: Exporta os dados do titular em JSON (RT-51) [EXTENSÃO]
      responses:
        "200":
          description: >
            Arquivo JSON com dados do usuário e seus reportes (descrição, categoria, coordenadas,
            endereço textual `address` e datas em UTC com fuso), comentários e dispositivos
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /v1/me/devices:
    put:
      tags: [me]
      summary: Registra o token de push do aparelho [EXTENSÃO]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [push_token, platform]
              properties:
                push_token: { type: string }
                platform: { type: string, enum: [android, ios] }
      responses:
        "204":
          description: Registrado
    delete:
      tags: [me]
      summary: Remove o token push do aparelho
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [push_token, platform]
              properties:
                push_token: { type: string }
                platform: { type: string, enum: [android, ios] }
      responses:
        "204":
          description: Removido

  /v1/me/reports:
    get:
      tags: [me]
      summary: Reportes do usuário (inclui anônimos via vínculo de notificação)
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/Status" } }
      responses:
        "200":
          description: Página de reportes
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/MyReportItem" }
                  next_cursor: { type: string, nullable: true }

  /v1/public/metrics:
    get:
      tags: [public]
      security: []
      summary: Indicadores do painel público (sem autenticação, sem dados pessoais)
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: category, in: query, schema: { $ref: "#/components/schemas/Category" } }
        - { name: agency_id, in: query, schema: { type: string } }
        - { name: format, in: query, schema: { type: string, enum: [json, csv], default: json } }
      responses:
        "200":
          description: Métricas agregadas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicMetrics" }
            text/csv:
              schema: { type: string }

  /v1/agency/reports/{id}/status:
    post:
      tags: [agency]
      security: [{ apiKeyAuth: [] }]
      summary: Atualização de status pelo órgão (chave de API com escopo de território)
      parameters:
        - $ref: "#/components/parameters/ReportId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgencyStatusRequest" }
      responses:
        "200":
          description: Status atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportDetail" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/staff/me:
    get:
      tags: [staff]
      summary: Perfil do servidor municipal (papel e órgão lidos do banco)
      description: Login pelo mesmo fluxo OTP (`/v1/auth/login`). Contas sem papel de servidor recebem 403.
      responses:
        "200":
          description: Perfil
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffProfile" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /v1/staff/agencies:
    get:
      tags: [staff]
      summary: Órgãos cadastrados (filtros do painel)
      responses:
        "200":
          description: Órgãos
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AgencyRef" }
        "403": { $ref: "#/components/responses/Error" }

  /v1/staff/summary:
    get:
      tags: [staff]
      summary: Totais por status, atrasados e a vencer, no escopo do servidor
      responses:
        "200":
          description: Resumo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffSummary" }
        "403": { $ref: "#/components/responses/Error" }

  /v1/staff/reports:
    get:
      tags: [staff]
      summary: Lista de reportes do escopo do servidor (sem dados pessoais — RN-43)
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/Status" } }
        - { name: category, in: query, schema: { $ref: "#/components/schemas/Category" } }
        - { name: overdue, in: query, schema: { type: boolean, default: false } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, description: "Busca por protocolo, descrição ou endereço (sem diferenciar maiúsculas)" }
        - $ref: "#/components/parameters/Limit"
        - { name: cursor, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Página de reportes
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/StaffReportItem" }
                  next_cursor: { type: string, nullable: true }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /v1/staff/reports/{id}:
    get:
      tags: [staff]
      summary: Detalhe de um reporte do escopo (cidadão mascarado na timeline)
      parameters:
        - $ref: "#/components/parameters/ReportId"
      responses:
        "200":
          description: Detalhe
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportDetail" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/staff/reports/{id}/status:
    post:
      tags: [staff]
      summary: Atualiza o status (somente papel `agency`; encaminhado → em_andamento → resolvido)
      parameters:
        - $ref: "#/components/parameters/ReportId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgencyStatusRequest" }
      responses:
        "200":
          description: Status atualizado; o cidadão é notificado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportDetail" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/staff/reports/{id}/redirect:
    post:
      tags: [staff]
      summary: Redireciona o reporte a outro órgão (agency no próprio escopo, manager e admin)
      description: >-
        Registra novo evento `encaminhado` com a justificativa, volta o status
        para `encaminhado`, define novo prazo (72 h se não informado), avisa o
        novo órgão e o cidadão. O órgão anterior deixa de ver o reporte.
      parameters:
        - $ref: "#/components/parameters/ReportId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffRedirectRequest" }
      responses:
        "200":
          description: Reporte redirecionado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportDetail" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/staff/moderation:
    get:
      tags: [staff]
      summary: Fila de moderação (moderator e admin)
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Reportes em moderação
          content:
            application/json:
              schema:
                type: object
                required: [items, count]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ReportSummary" }
                  count: { type: integer }
        "403": { $ref: "#/components/responses/Error" }

  /v1/staff/moderation/{id}/{decision}:
    post:
      tags: [staff]
      summary: Aprova ou rejeita um reporte da fila, com justificativa (moderator e admin)
      description: >-
        `approve` mantém o órgão de um reporte já encaminhado (ex.: sinalização
        improcedente) ou, com `category`/`subcategory`, reclassifica e encaminha
        pela matriz de roteamento. `reject` marca `triage_state=rejected`: o
        reporte sai do mapa público e do agrupamento de duplicados.
      parameters:
        - $ref: "#/components/parameters/ReportId"
        - { name: decision, in: path, required: true, schema: { type: string, enum: [approve, reject] } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffModerationRequest" }
      responses:
        "200":
          description: Decisão registrada na timeline (moderacao_aprovada / moderacao_rejeitada)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportDetail" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/staff/analytics:
    get:
      tags: [staff]
      summary: Analítica do painel no escopo do servidor
      parameters:
        - { name: from, in: query, schema: { type: string, format: date }, description: "Padrão: 29 dias antes de `to`" }
        - { name: to, in: query, schema: { type: string, format: date }, description: "Padrão: hoje (UTC)" }
        - { name: bucket, in: query, schema: { type: string, enum: [day, week], default: day } }
      responses:
        "200":
          description: Totais, série temporal e agregações
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffAnalytics" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/uploads/{token}:
    put:
      tags: [uploads]
      security: []
      summary: Upload de foto no armazenamento local (somente dev; em produção usa-se URL assinada do S3)
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      responses:
        "204": { description: Recebido }
        "403": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  parameters:
    ReportId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }

  responses:
    Error:
      description: Erro no formato padrão (RT-17)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: validation_error
            message: { type: string, example: "Informe uma foto ou uma descrição." }
            field: { type: string, nullable: true, example: description }
            correlation_id: { type: string, nullable: true }

    Category:
      type: string
      enum: [risco_urbano, transporte_publico, saude_atendimento, a_classificar]

    Urgency:
      type: string
      enum: [baixa, media, alta]

    Status:
      type: string
      enum: [recebido, encaminhado, em_andamento, resolvido]

    EventType:
      type: string
      enum:
        - recebido
        - encaminhado
        - em_andamento
        - resolvido
        - reaberto
        - contestado
        - classificado
        - classificacao_confirmada
        - classificacao_corrigida
        - enviado_moderacao
        - vinculado_grupo
        - confirmacao_adicionada
        - cobrado
        - sinalizado
        - moderacao_aprovada
        - moderacao_rejeitada

    LoginRequest:
      type: object
      properties:
        email: { type: string, format: email }
        code: { type: string, pattern: "^[0-9]{6}$" }
        google_id_token: { type: string }
        consent:
          type: object
          required: [version, accepted_age]
          properties:
            version: { type: string, example: "2026-11-01" }
            accepted_age: { type: boolean }
      description: Informe `email` (passo 1), `email`+`code` (passo 2) ou `google_id_token`.

    AuthTokens:
      type: object
      required: [access_token, refresh_token, expires_in, user]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer, example: 900 }
        user: { $ref: "#/components/schemas/User" }

    User:
      type: object
      required: [id, role]
      properties:
        id: { type: string }
        email: { type: string, format: email, nullable: true }
        role: { type: string, enum: [citizen, agency, moderator, manager, admin] }
        consent_version: { type: string }
        created_at: { type: string, format: date-time }

    CreateReportRequest:
      type: object
      required: [id, lat, lon, client_created_at]
      properties:
        id: { type: string, format: uuid, description: "UUID gerado no cliente (idempotência)" }
        description: { type: string, maxLength: 1000, nullable: true }
        has_photo: { type: boolean, default: false }
        category: { $ref: "#/components/schemas/Category" }
        lat: { type: number, minimum: -90, maximum: 90 }
        lon: { type: number, minimum: -180, maximum: 180 }
        location_accuracy_m: { type: number, nullable: true }
        anonymous: { type: boolean, default: false }
        client_created_at: { type: string, format: date-time, description: "Data/hora original (RN-11)" }
        address:
          type: string
          maxLength: 200
          nullable: true
          example: "Rua Exemplo, 123 – Bairro, Cidade"
          description: >
            Endereço textual gerado no aparelho (geocodificação reversa). Opcional: ausente ou null
            em versões antigas do app ou falha do geocodificador. O servidor remove espaços nas
            pontas e grava string vazia como null; mais de 200 caracteres (após o corte) devolve 422.
            Texto não confiável: clientes exibem como texto puro, nunca como HTML.
      description: Exige `description` ou `has_photo=true` (RN-09).

    UploadInstruction:
      type: object
      required: [url, method, expires_at]
      properties:
        url: { type: string, format: uri }
        method: { type: string, enum: [PUT] }
        headers:
          type: object
          additionalProperties: { type: string }
        max_bytes: { type: integer }
        expires_at: { type: string, format: date-time }

    ReportCreated:
      type: object
      required: [id, protocol, status, received_at]
      properties:
        id: { type: string, format: uuid }
        protocol: { type: string, example: RPT-2026-4KQ7TD }
        status: { $ref: "#/components/schemas/Status" }
        received_at: { type: string, format: date-time }
        upload:
          allOf:
            - $ref: "#/components/schemas/UploadInstruction"
          nullable: true
        triage_state: { $ref: "#/components/schemas/TriageState" }

    TriageState:
      type: string
      enum: [pending_classification, awaiting_user, confirmed, auto_confirmed, in_moderation, rejected]

    Classification:
      type: object
      required: [category, confidence, immediate_risk, source, model, escalated]
      properties:
        category: { $ref: "#/components/schemas/Category" }
        subcategory: { type: string, nullable: true }
        urgency:
          allOf: [{ $ref: "#/components/schemas/Urgency" }]
          nullable: true
        confidence: { type: number, minimum: 0, maximum: 1 }
        immediate_risk: { type: boolean, nullable: true }
        source: { type: string, enum: [ai, user, none], description: "none = IA indisponível (RT-30)" }
        model: { type: string }
        escalated: { type: boolean }

    AgencyRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }

    TimelineEvent:
      type: object
      required: [id, type, actor, created_at]
      properties:
        id: { type: string }
        type: { $ref: "#/components/schemas/EventType" }
        actor: { type: string, example: "agency:prefeitura-demo" }
        actor_label: { type: string, example: "Prefeitura Demo" }
        justification: { type: string, nullable: true }
        deadline: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    ReportSummary:
      type: object
      required: [id, protocol, status, category, received_at]
      properties:
        id: { type: string, format: uuid }
        protocol: { type: string }
        status: { $ref: "#/components/schemas/Status" }
        overdue: { type: boolean }
        category:
          allOf: [{ $ref: "#/components/schemas/Category" }]
          nullable: true
        subcategory: { type: string, nullable: true }
        lat: { type: number }
        lon: { type: number }
        received_at: { type: string, format: date-time, example: "2026-11-19T23:29:25.789511Z" }
        group_id: { type: string }
        confirmation_count: { type: integer, minimum: 0 }

    MyReportItem:
      description: Item de `GET /v1/me/reports`; o app usa `description` como título do card.
      allOf:
        - $ref: "#/components/schemas/ReportSummary"
        - type: object
          required: [description, subcategory, address]
          properties:
            description: { type: string, nullable: true }
            subcategory: { type: string, nullable: true, description: "Da classificação mais recente (mesmo valor de `classification.subcategory` no detalhe)" }
            address: { type: string, nullable: true, description: "Endereço textual enviado pelo app; null em reportes antigos" }

    ReportDetail:
      allOf:
        - $ref: "#/components/schemas/ReportSummary"
        - type: object
          properties:
            description: { type: string, nullable: true }
            address: { type: string, nullable: true, description: "Endereço textual enviado pelo app; null em reportes antigos" }
            photo_url: { type: string, format: uri, nullable: true, description: "URL assinada e temporária" }
            anonymous: { type: boolean }
            has_photo: { type: boolean }
            triage_state: { $ref: "#/components/schemas/TriageState" }
            classification: { allOf: [{ $ref: "#/components/schemas/Classification" }], nullable: true }
            agency: { allOf: [{ $ref: "#/components/schemas/AgencyRef" }], nullable: true }
            deadline: { type: string, format: date-time, nullable: true }
            confirmation_count: { type: integer }
            reopened_count: { type: integer }
            can_reopen: { type: boolean }
            can_nudge: { type: boolean }
            timeline:
              type: array
              items: { $ref: "#/components/schemas/TimelineEvent" }

    TriageRequest:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [confirm, correct] }
        category: { $ref: "#/components/schemas/Category" }
        subcategory: { type: string }
      description: Em `correct`, `category` é obrigatório.

    NearbyItem:
      type: object
      required: [id, status, category, lat, lon]
      properties:
        id: { type: string, format: uuid }
        group_id: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/Status" }
        category: { $ref: "#/components/schemas/Category" }
        subcategory: { type: string, nullable: true }
        lat: { type: number }
        lon: { type: number }
        confirmation_count: { type: integer }
        received_at: { type: string, format: date-time }
        distance_m: { type: integer, description: "Metros, a partir da coordenada publicada" }

    AgencyStatusRequest:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [in_progress, resolved, contest] }
        deadline: { type: string, format: date-time, description: "Obrigatório em in_progress" }
        justification: { type: string, maxLength: 1000, description: "Obrigatório em resolved e contest" }

    StaffRedirectRequest:
      type: object
      required: [agency_id, justification]
      properties:
        agency_id: { type: string, maxLength: 64 }
        justification: { type: string, minLength: 1, maxLength: 1000 }
        deadline: { type: string, format: date-time, description: "Futuro e com fuso; padrão now + 72 h" }

    StaffModerationRequest:
      type: object
      required: [justification]
      properties:
        justification: { type: string, minLength: 1, maxLength: 1000 }
        category:
          allOf: [{ $ref: "#/components/schemas/Category" }]
          description: "Só em approve: reclassifica e encaminha"
        subcategory: { type: string, maxLength: 64 }

    StaffAnalytics:
      type: object
      required: [period, totals, timeseries, by_category, by_agency, by_region]
      properties:
        period:
          type: object
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
            bucket: { type: string, enum: [day, week] }
        totals:
          type: object
          properties:
            reports: { type: integer }
            resolved: { type: integer }
            open: { type: integer }
            overdue: { type: integer }
        timeseries:
          type: array
          items:
            type: object
            properties:
              period: { type: string, format: date, description: "Dia ou segunda-feira da semana" }
              opened: { type: integer }
              resolved: { type: integer }
        by_category:
          type: array
          items:
            type: object
            properties:
              category: { $ref: "#/components/schemas/Category" }
              reports: { type: integer }
              resolved: { type: integer }
        by_agency:
          type: array
          items:
            type: object
            properties:
              agency: { $ref: "#/components/schemas/AgencyRef" }
              reports: { type: integer }
              resolved: { type: integer }
              overdue: { type: integer }
              avg_resolution_hours: { type: number, nullable: true }
        by_region:
          type: array
          description: "Células de geohash (6 caracteres, ~1,2 km x 0,6 km); não há base de bairros"
          items:
            type: object
            properties:
              region: { type: string }
              lat: { type: number }
              lon: { type: number }
              reports: { type: integer }
              resolved: { type: integer }

    StaffProfile:
      type: object
      required: [id, role, scope]
      properties:
        id: { type: string }
        email: { type: string, nullable: true }
        role: { type: string, enum: [agency, manager, moderator, admin] }
        scope: { type: string, enum: [agency, all], description: "agency = restrito ao órgão vinculado" }
        agency: { allOf: [{ $ref: "#/components/schemas/AgencyRef" }], nullable: true }

    StaffSummary:
      type: object
      required: [total, by_status, overdue, due_soon]
      properties:
        total: { type: integer }
        by_status:
          type: object
          additionalProperties: { type: integer }
        overdue: { type: integer }
        due_soon: { type: integer, description: "Prazo vence nas próximas 12 horas" }

    StaffReportItem:
      type: object
      required: [id, protocol, status, received_at, overdue, confirmation_count]
      properties:
        id: { type: string, format: uuid }
        protocol: { type: string }
        status: { $ref: "#/components/schemas/Status" }
        category:
          allOf: [{ $ref: "#/components/schemas/Category" }]
          nullable: true
        urgency: { type: string, nullable: true }
        immediate_risk: { type: boolean, nullable: true }
        description: { type: string, nullable: true }
        lat: { type: number }
        lon: { type: number }
        received_at: { type: string, format: date-time }
        deadline: { type: string, format: date-time, nullable: true }
        overdue: { type: boolean }
        agency: { allOf: [{ $ref: "#/components/schemas/AgencyRef" }], nullable: true }
        confirmation_count: { type: integer }
        address: { type: string, nullable: true, description: "Endereço textual enviado pelo app; null em reportes antigos" }

    PublicMetrics:
      type: object
      required: [period, totals, by_agency]
      properties:
        period:
          type: object
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
        totals:
          type: object
          properties:
            reports: { type: integer }
            avg_response_hours: { type: number, nullable: true }
            resolution_rate: { type: number, nullable: true, minimum: 0, maximum: 1 }
            recurrence: { type: integer }
        by_agency:
          type: array
          items:
            type: object
            properties:
              agency: { $ref: "#/components/schemas/AgencyRef" }
              reports: { type: integer }
              avg_response_hours: { type: number, nullable: true }
              resolution_rate: { type: number, nullable: true }
        by_month:
          type: array
          items:
            type: object
            properties:
              month: { type: string, example: "2026-10" }
              reports: { type: integer }
        heatmap:
          type: array
          description: Células com contagem abaixo do mínimo são omitidas (RT-42)
          items:
            type: object
            properties:
              geohash: { type: string }
              count: { type: integer }
        methodology_url: { type: string, format: uri }
