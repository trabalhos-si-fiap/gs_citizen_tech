services:
  api:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    env_file:
      - ./back-end/.env.example
    ports:
      - "8000:8000"
    volumes:
      - photo-data:/app/var/photos

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  photo-data:
