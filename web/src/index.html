<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reclame Já</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <div>
        <span class="brand">Reclame Já</span>
        <h1>Identidade visual unificada</h1>
        <p>Design System com tipografia Poppins e paleta institucional.</p>
      </div>

      <div class="panel" aria-label="Paleta de cores do Reclame Já">
        <div class="swatch">
          <div class="swatch-color" style="background: #ebe100"></div>
          <span>Amarelo</span>
        </div>
        <div class="swatch">
          <div class="swatch-color" style="background: #22c55e"></div>
          <span>Verde</span>
        </div>
        <div class="swatch">
          <div class="swatch-color" style="background: #4ade80"></div>
          <span>Verde claro</span>
        </div>
        <div class="swatch">
          <div class="swatch-color" style="background: #ef4444"></div>
          <span>Alerta</span>
        </div>
        <div class="swatch">
          <div class="swatch-color" style="background: #f9f9fc"></div>
          <span>Surface</span>
        </div>
      </div>
    </main>
  </body>
</html>
